<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JG">
  <title>JG</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe6ff"/>
      <stop offset="1" stop-color="#1257ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ff0ff"/>
      <stop offset="1" stop-color="#1a7bff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#050b2a"/>
      <stop offset="1" stop-color="#01030f"/>
    </radialGradient>
  </defs>

  <!-- Contenedor con bordes redondeados -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Solo las letras, ampliadas: sin anillo, trazos, nodos ni glow, que por
       debajo de 32 px no se leen. -->
  <g transform="translate(256 256) scale(0.72) translate(-652 -592.5)">
    <!-- Letra J -->
    <polygon fill="url(#g2)" points="548,405 618,335 618,745 548,817 397,817 335,755 422,667 422,748 515,748 548,712"/>
    <polygon fill="#1257ff" opacity="0.55" points="422,748 515,748 548,712 548,817 470,817"/>

    <!-- Letra G, algo separada de la J para que no se fundan en pequeño -->
    <g transform="translate(24 0)">
      <polygon fill="url(#g1)" points="700,423 882,423 822,484 745,484 638,592 638,700 700,748 838,748 778,808 710,808 638,730 638,500"/>
      <polygon fill="#1257ff" opacity="0.6" points="700,748 838,748 778,808 710,808"/>
      <polygon fill="url(#g2)" points="795,578 945,578 945,748 848,850 785,850 870,758 870,642 730,642"/>
    </g>
  </g>
</svg>
