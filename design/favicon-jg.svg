<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JG">
  <title>JG</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe6ff"/>
      <stop offset="1" stop-color="#1257ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ff0ff"/>
      <stop offset="1" stop-color="#1a7bff"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b4fe0"/>
      <stop offset="1" stop-color="#2fe0ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#050b2a"/>
      <stop offset="1" stop-color="#01030f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Contenedor con bordes redondeados -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <g transform="translate(256 258) scale(0.58) translate(-630 -602)" filter="url(#glow)">
