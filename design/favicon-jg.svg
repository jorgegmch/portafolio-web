    <polygon fill="#1257ff" opacity="0.6" points="700,748 838,748 778,808 710,808"/>
    <polygon fill="url(#g2)" points="795,578 945,578 945,748 848,850 785,850 870,758 870,642 730,642"/>

    <!-- Trazos de circuito de la G -->
    <g fill="none" stroke="#35e6ff" stroke-width="7" stroke-linejoin="miter">
      <path d="M690 585 L758 517 H838 L912 445"/>
      <path d="M690 585 V700 L720 745 H838"/>
      <path d="M648 570 V690"/>
      <path d="M676 886 L695 862 H846"/>
