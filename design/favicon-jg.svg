      <path d="M390 893 A383 383 0 0 1 257 630" stroke="#1a6bff"/>
      <path d="M285 447 A383 383 0 0 1 472 260" stroke="#1a55e0"/>
    </g>

    <!-- Letra J -->
    <polygon fill="url(#g2)" points="548,405 618,335 618,745 548,817 397,817 335,755 422,667 422,748 515,748 548,712"/>
    <polygon fill="#1257ff" opacity="0.55" points="422,748 515,748 548,712 548,817 470,817"/>

    <!-- Trazos de circuito de la J -->
    <g fill="none" stroke="#35e6ff" stroke-width="7" stroke-linejoin="miter">
      <path d="M503 372 L552 325"/>
      <path d="M515 405 L580 342 V300"/>
      <path d="M510 372 V718 L494 730"/>
      <path d="M338 490 H395 L503 612"/>
