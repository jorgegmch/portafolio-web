<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Formulario de contacto (teléfono)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@400;600&amp;family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.field{width:100%;box-sizing:border-box;min-height:52px;padding:14px 16px;border-radius:16px;border:1.5px solid rgba(242,238,230,0.14);background:#1A1A1D;color:#F2EEE6;font-family:Manrope,sans-serif;font-size:16px}
.field::placeholder{color:#8F8B84}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FF5B24; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: #F2EEE6">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6,6,7,0.5)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="fm-title" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; border-radius: 32px 32px 0 0; background: #111113; display: flex; flex-direction: column">
<div aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: rgba(242,238,230,0.25); margin-top: 10px"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #FF5B24">nuevo_mensaje()</span>
<h2 id="fm-title" style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 44px; line-height: 0.92; text-transform: uppercase">Cuéntame<br>tu idea</h2>
</div>
<button type="button" aria-label="Cerrar formulario" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(242,238,230,0.2); background: transparent; color: #F2EEE6; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 20px; overflow: auto">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-name" style="font-size: 13px; font-weight: 700">Nombre</label><input id="m-name" class="field" type="text" autocomplete="name" placeholder="Cómo te llamas"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-mail" style="font-size: 13px; font-weight: 700">Correo</label><input id="m-mail" class="field" type="email" autocomplete="email" placeholder="Donde te respondo"></div>
<fieldset style="margin: 0; padding: 0; border: 0"><legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 700">¿Qué necesitas?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #FF5B24; background: #FF5B24; color: #0A0A0B; font-family: Manrope, sans-serif; font-weight: 700">Backend</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(242,238,230,0.18); background: transparent; color: #F2EEE6; font-family: Manrope, sans-serif; font-weight: 700">Frontend</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(242,238,230,0.18); background: transparent; color: #F2EEE6; font-family: Manrope, sans-serif; font-weight: 700">Full-Stack</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(242,238,230,0.18); background: transparent; color: #F2EEE6; font-family: Manrope, sans-serif; font-weight: 700">IA</button>
</div></fieldset>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-msg" style="font-size: 13px; font-weight: 700">Mensaje</label><textarea id="m-msg" class="field" rows="4" placeholder="Qué quieres construir y para cuándo" style="resize: none; line-height: 1.5"></textarea></div>
<button type="submit" style="margin-top: auto; min-height: 56px; border-radius: 999px; border: 0; background: #FF5B24; color: #0A0A0B; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800">Enviar mensaje</button>
</form>
</div>
</div>
</x-dc>

</body>
</html>
